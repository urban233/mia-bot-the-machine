services:
  train:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: mia-bot-train:latest
    container_name: mia-bot-train
    stdin_open: true
    tty: true
    ipc: host
    shm_size: '2gb'
    environment:
      - MIA_HARDWARE_PROFILE=${MIA_HARDWARE_PROFILE:-ryzen_3400g_rtx_4060}
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ../data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: ["--resume"]

  export:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: mia-bot-train:latest
    container_name: mia-bot-export
    entrypoint: ["python", "-m", "mia_bot.export"]
    volumes:
      - ../data:/app/data
      - ../:/app/out
    command: ["--checkpoints-dir", "/app/data/checkpoints", "--output", "/app/out/policy.pt"]

