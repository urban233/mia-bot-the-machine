services:
  train:
    build:
      context: .
      dockerfile: Dockerfile
    image: mia-bot-train:latest
    container_name: mia-bot-train
    stdin_open: true
    tty: true
    ipc: host
    shm_size: '2gb'
    environment:
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: ["--resume"]

  export:
    build:
      context: .
      dockerfile: Dockerfile
    image: mia-bot-train:latest
    container_name: mia-bot-export
    entrypoint: ["python", "export.py"]
    volumes:
      - ./data:/app/data
      - ./:/app/out
    command: ["--checkpoints-dir", "/app/data/checkpoints", "--output", "/app/out/policy.pt"]

