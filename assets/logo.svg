<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#161B26"/>
      <stop offset="60%" stop-color="#0B0E14"/>
      <stop offset="100%" stop-color="#05070A"/>
    </radialGradient>

    <!-- Neon Glow Accents (Cyan = Pin-Bot / Blue Team, Pink = The Bride / Orange Team) -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5187c1"/>
      <stop offset="100%" stop-color="#87bdef"/>
    </linearGradient>

    <linearGradient id="pinkNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dda418"/>
      <stop offset="100%" stop-color="#c88a13"/>
    </linearGradient>

    <linearGradient id="metalSheen" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="url(#metalSheen)" stroke-width="2"/>

  <!-- Geometric Grid Accent (Pinball Matrix Reference) -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="156" y1="60" x2="156" y2="452"/>
    <line x1="256" y1="60" x2="256" y2="452"/>
    <line x1="356" y1="60" x2="356" y2="452"/>
    <line x1="60" y1="200" x2="452" y2="200"/>
    <line x1="60" y1="290" x2="452" y2="290"/>
  </g>

  <!-- ==================== ROBOT CHASSIS / HELMET ==================== -->
  <!-- Outer Helmet / Crown Silhouette -->
  <path d="M 176 100 L 256 64 L 336 100 L 396 170 L 380 290 L 330 360 L 256 390 L 182 360 L 132 290 L 116 170 Z" 
        fill="#111622" 
        stroke="#232B3E" 
        stroke-width="3" 
        stroke-linejoin="round"/>

  <!-- Left / Right Split Face Plates -->
  <!-- Left Side: Angular Pin-Bot Structure -->
  <path d="M 256 64 L 176 100 L 132 170 L 148 280 L 190 340 L 256 370 Z" 
        fill="#151C2C" 
        stroke="#1E283D" 
        stroke-width="1.5"/>

  <!-- Right Side: Sleek Metamorphosis Plate (The Bride) -->
  <path d="M 256 64 L 336 100 L 380 170 L 364 280 L 322 340 L 256 370 Z" 
        fill="#192032" 
        stroke="#1E283D" 
        stroke-width="1.5"/>

  <!-- Center Metallic Core Seam -->
  <line x1="256" y1="64" x2="256" y2="370" stroke="#2D3A54" stroke-width="2" stroke-dasharray="8 4"/>

  <!-- ==================== THE ICONIC VISOR ==================== -->
  <!-- Visor Housing Frame -->
  <polygon points="160,200 352,200 336,256 176,256" fill="#080B10" stroke="#2A354D" stroke-width="2"/>

  <!-- Dual-Energy Laser Visor (Pin-Bot Cyan Left / Bride Pink Right) -->
  <!-- Left Visor Core -->
  <polygon points="168,208 252,208 252,248 180,248" fill="url(#cyanNeon)" filter="url(#glow)"/>
  <!-- Right Visor Core -->
  <polygon points="260,208 344,208 332,248 260,248" fill="url(#pinkNeon)" filter="url(#glow)"/>

  <!-- Segmented Digital Slits (Pinball Matrix Display HUD) -->
  <g fill="#080B10" opacity="0.65">
    <rect x="194" y="206" width="4" height="44"/>
    <rect x="222" y="206" width="4" height="44"/>
    <rect x="250" y="206" width="12" height="44"/>
    <rect x="286" y="206" width="4" height="44"/>
    <rect x="314" y="206" width="4" height="44"/>
    <line x1="164" y1="228" x2="348" y2="228" stroke="#080B10" stroke-width="3"/>
  </g>

  <!-- ==================== LOWER CHIN / MOUTH MATRIX ==================== -->
  <!-- Angular Positronic Vocoder -->
  <polygon points="216,290 296,290 286,330 226,330" fill="#0C1018" stroke="#232D42" stroke-width="1.5"/>
  <line x1="232" y1="304" x2="280" y2="304" stroke="#5187c1" stroke-width="2" opacity="0.8"/>
  <line x1="236" y1="316" x2="276" y2="316" stroke="#dda418" stroke-width="2" opacity="0.8"/>

  <!-- Forehead Jewel / Apex Strike Sphere (Pinball & Boost node) -->
  <circle cx="256" cy="120" r="10" fill="#0E1420" stroke="#374766" stroke-width="2"/>
  <circle cx="256" cy="120" r="5" fill="#5187c1" filter="url(#glow)"/>

  <!-- ==================== TYPOGRAPHY ==================== -->
  <text x="256" y="428" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
        font-size="28" 
        font-weight="900" 
        letter-spacing="9" 
        fill="#FFFFFF">MIA<tspan fill="#5187c1">-</tspan><tspan fill="#dda418">BOT</tspan></text>

  <text x="256" y="456" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
        font-size="11" 
        font-weight="600" 
        letter-spacing="5" 
        fill="#5A6E8C">THE MACHINE</text>
</svg>
